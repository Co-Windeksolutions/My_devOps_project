# Values for bitnami/rabbitmq
auth:
  username: "minibank_broker"
  existingPasswordSecret: "rabbitmq-credentials"
  existingErlangSecret: "rabbitmq-credentials"

clustering:
  enabled: false
  addressType: ip

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: true
  existingClaim: "rabbitmq-data-rabbitmq-0"
  subPath: "mnesia"
  size: 8Gi

service:
  clusterIP: "10.104.114.242"
