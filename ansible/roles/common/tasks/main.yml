---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  apt:
    name:
      - curl
      - wget
      - git
      - unzip
      - python3-pip
      - net-tools
    state: present

- name: Set hostname
  hostname:
    name: "{{ inventory_hostname }}"

- name: Disable swap (required for Kubernetes)
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Remove swap from fstab permanently
  replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
    replace: '# \1'

- name: Set timezone to UTC
  timezone:
    name: UTC

- name: Install Helm (required for deploying Postgres and RabbitMQ)
  block:
    - name: Download Helm install script
      get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get-helm-3.sh
        mode: "0700"

    - name: Run Helm install script
      command: /tmp/get-helm-3.sh
      args:
        creates: /usr/local/bin/helm   # skip if helm already installed

    - name: Clean up Helm install script
      file:
        path: /tmp/get-helm-3.sh
        state: absent