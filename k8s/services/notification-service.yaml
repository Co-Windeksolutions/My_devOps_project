apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: minibank
  labels:
    app: notification-service
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
  - name: http
    port: 8000
    targetPort: 8003
  - name: direct
    port: 8003
    targetPort: 8003